<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Bot - Panel de Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 40px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 36px;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #ff0050, #00f2ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .card {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        
        .card h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #00f2ea;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #888;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #00f2ea;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            margin: 5px;
            transition: transform 0.2s;
        }
        
        .btn:hover { transform: scale(1.05); }
        
        .btn-primary {
            background: linear-gradient(135deg, #ff0050, #00f2ea);
            color: #fff;
        }
        
        .btn-danger {
            background: #ff4444;
            color: #fff;
        }
        
        .btn-success {
            background: #00ff88;
            color: #000;
        }
        
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        
        .status.running {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            color: #00ff88;
        }
        
        .status.stopped {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            color: #ff4444;
        }
        
        .log {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 4px;
        }
        
        .log-entry.info { color: #00f2ea; }
        .log-entry.bid { color: #ff0050; }
        .log-entry.claim { color: #00ff88; }
        .log-entry.error { color: #ff4444; }
        
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .user-item {
            background: #0a0a0a;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .user-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff88;
        }
        
        .user-status.inactive {
            background: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 TikTok Bot - Panel de Control</h1>
        
        <!-- Control del Bot -->
        <div class="card">
            <h2>🔴 Control del Bot</h2>
            
            <div class="input-group">
                <label>URL del TikTok Live:</label>
                <input type="text" id="live-url" placeholder="https://www.tiktok.com/@usuario/live">
            </div>
            
            <div id="status" class="status stopped">
                ⏹️ Bot detenido
            </div>
            
            <button class="btn btn-primary" onclick="startBot()">▶️ Iniciar Bot</button>
            <button class="btn btn-danger" onclick="stopBot()">⏹️ Detener Bot</button>
        </div>
        
        <!-- Usuarios con Caja -->
        <div class="card">
            <h2>📦 Usuarios con Caja Pagada</h2>
            <div class="users-grid" id="users-list"></div>
        </div>
        
        <!-- Log en Tiempo Real -->
        <div class="card">
            <h2>📊 Log en Tiempo Real</h2>
            <div class="log" id="log-container"></div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io('http://192.168.1.140:5001');
        
        // Conectar
        socket.on('connect', () => {
            addLog('✅ Conectado al bot', 'info');
        });
        
        socket.on('disconnect', () => {
            addLog('❌ Desconectado del bot', 'error');
        });
        
        socket.on('new_message', (msg) => {
            const type = msg.type === 'bid' ? 'bid' : msg.type === 'claim' ? 'claim' : 'info';
            addLog(`${msg.user}: ${msg.text} [${msg.type}]`, type);
        });
        
        socket.on('price_update', (data) => {
            addLog(`💰 Nueva puja más alta: ${data.price}€`, 'bid');
        });
        
        socket.on('new_winner', (winner) => {
            addLog(`🏆 GANADOR: ${winner.user} - ${winner.product} por ${winner.price}€`, 'claim');
        });
        
        function addLog(text, type = 'info') {
            const container = document.getElementById('log-container');
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        async function startBot() {
            const url = document.getElementById('live-url').value;
            
            if (!url) {
                alert('❌ Ingresa la URL del Live');
                return;
            }
            
            try {
                const resp = await fetch('http://192.168.1.140:5001/api/start_bot', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url})
                });
                
                const data = await resp.json();
                if (data.status === 'started') {
                    document.getElementById('status').className = 'status running';
                    document.getElementById('status').textContent = '🔴 Bot en ejecución - Leyendo chat...';
                    addLog('✅ Bot iniciado correctamente', 'info');
                }
            } catch (e) {
                alert('❌ Error: ' + e.message);
            }
        }
        
        async function stopBot() {
            try {
                await fetch('http://192.168.1.140:5001/api/stop_bot', {method: 'POST'});
                document.getElementById('status').className = 'status stopped';
                document.getElementById('status').textContent = '⏹️ Bot detenido';
                addLog('⏹️ Bot detenido', 'info');
            } catch (e) {
                alert('❌ Error: ' + e.message);
            }
        }
        
        // Cargar usuarios
        const users = ['@carlos92', '@maria_garcia', '@juan_perez', '@lucia_88', '@pedro_shop'];
        const usersList = document.getElementById('users-list');
        usersList.innerHTML = users.map(u => `
            <div class="user-item">
                <span>${u}</span>
                <div class="user-status"></div>
            </div>
        `).join('');
    </script>
</body>
</html>
