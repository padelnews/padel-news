<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatClaw JARVIS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #02080d;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        
        /* Top Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 100;
        }
        
        .logo {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #4fd1f9;
        }
        
        .logo span { color: #4ade80; }
        
        .time-pill {
            background: rgba(10, 20, 30, 0.8);
            border: 1px solid #1e293b;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 12px;
            color: #94a3b8;
        }
        
        .top-right {
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 12px;
            color: #94a3b8;
        }
        
        /* Layout Principal */
        .dashboard {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 20px;
            padding: 70px 24px 24px;
            height: 100vh;
        }
        
        /* Paneles */
        .panel {
            background: rgba(10, 20, 30, 0.6);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .panel-title {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1e293b;
        }
        
        /* Stats */
        .stat-row {
            margin-bottom: 14px;
        }
        
        .stat-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
        }
        
        .stat-value {
            color: #4fd1f9;
            font-weight: 700;
        }
        
        .bar {
            height: 6px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4fd1f9, #0ea5e9);
            border-radius: 3px;
            transition: width 0.5s;
        }
        
        /* Weather */
        .weather-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(30, 41, 59, 0.3);
            border-radius: 8px;
        }
        
        .temp {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
        }
        
        .weather-icon {
            font-size: 24px;
        }
        
        /* Centro - Orbe */
        .center-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        #orb-container {
            width: 320px;
            height: 320px;
            position: relative;
        }
        
        #orb-canvas {
            width: 100%;
            height: 100%;
        }
        
        .orb-label {
            text-align: center;
            margin-top: 20px;
        }
        
        .orb-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #4fd1f9;
            margin-bottom: 8px;
        }
        
        .orb-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 20, 30, 0.8);
            border: 1px solid #1e293b;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 11px;
            color: #4fd1f9;
        }
        
        .orb-status::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        /* Chat Panel */
        .chat-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #1e293b;
        }
        
        .chat-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn-pill {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 10px;
            color: #94a3b8;
            cursor: pointer;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.4;
        }
        
        .msg.user {
            align-self: flex-end;
            background: rgba(30, 41, 59, 0.6);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        
        .msg.jarvis {
            align-self: flex-start;
            background: rgba(79, 209, 249, 0.08);
            border-left: 2px solid #4fd1f9;
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        
        .chat-input-area {
            display: flex;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid #1e293b;
        }
        
        #chat-input {
            flex: 1;
            background: rgba(30, 41, 59, 0.3);
            border: 1px solid #1e293b;
            border-radius: 20px;
            padding: 10px 16px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        
        #chat-input:focus {
            border-color: #4fd1f9;
        }
        
        .btn-send {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(79, 209, 249, 0.15);
            border: 1px solid #4fd1f9;
            color: #4fd1f9;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .btn-send:hover {
            background: rgba(79, 209, 249, 0.3);
        }
        
        .btn-mic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(79, 209, 249, 0.15);
            border: 1px solid #4fd1f9;
            color: #4fd1f9;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .btn-mic.listening {
            background: rgba(74, 222, 128, 0.3);
            border-color: #4ade80;
            animation: pulse-btn 1s infinite;
        }
        
        @keyframes pulse-btn {
            0%, 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.5); }
            50% { box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo">CHAT<span>CLAW</span></div>
        <div class="time-pill" id="time-pill">--:--:--</div>
        <div class="top-right">
            <span>🌡️ --°C</span>
            <span>⚙️</span>
        </div>
    </div>
    
    <div class="dashboard">
        <!-- Panel Izquierdo -->
        <div class="panel">
            <div class="panel-title">🖥️ System Stats</div>
            
            <div class="stat-row">
                <div class="stat-header">
                    <span>CPU</span>
                    <span class="stat-value" id="cpu-val">--%</span>
                </div>
                <div class="bar"><div class="bar-fill" id="cpu-bar" style="width:0%"></div></div>
            </div>
            
            <div class="stat-row">
                <div class="stat-header">
                    <span>RAM</span>
                    <span class="stat-value" id="ram-val">--%</span>
                </div>
                <div class="bar"><div class="bar-fill" id="ram-bar" style="width:0%"></div></div>
            </div>
            
            <div class="stat-row">
                <div class="stat-header">
                    <span>GPU</span>
                    <span class="stat-value" id="gpu-val">--%</span>
                </div>
                <div class="bar"><div class="bar-fill" id="gpu-bar" style="width:0%"></div></div>
            </div>
            
            <div class="weather-card">
                <div class="temp" id="temp-val">--°C</div>
                <div class="weather-icon">☁️</div>
            </div>
            
            <div class="panel-title">📊 Activity</div>
            <div style="font-size:11px;color:#94a3b8;">Requests: <span id="req-count" style="color:#4fd1f9;">0</span></div>
        </div>
        
        <!-- Centro -->
        <div class="center-area">
            <div id="orb-container">
                <canvas id="orb-canvas"></canvas>
            </div>
            <div class="orb-label">
                <div class="orb-title">J.A.R.V.I.S.</div>
                <div class="orb-status" id="orb-status">● System Online</div>
            </div>
        </div>
        
        <!-- Panel Derecho - Chat -->
        <div class="panel chat-panel">
            <div class="chat-header">
                <div class="panel-title" style="border:none;padding:0;">Conversation</div>
                <div class="chat-actions">
                    <button class="btn-pill">Clear</button>
                </div>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                <div class="msg jarvis">
                    Sistema en línea. Pulsa 🎤 para hablar o escribe aquí.
                </div>
            </div>
            
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type a message..." />
                <button class="btn-mic" id="btn-mic">🎤</button>
                <button class="btn-send" id="chat-send">➤</button>
            </div>
        </div>
        
        <!-- Debug speech -->
        <div id="speech-debug" style="position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#4fd1f9;padding:10px 20px;border-radius:8px;font-size:12px;display:none;z-index:999;max-width:80%;text-align:center;"></div>
    </div>

    <script>
        // === THREE.JS ORBE ===
        const canvas = document.getElementById('orb-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        
        renderer.setSize(320, 320);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        camera.position.z = 45;
        
        // Partículas (1500)
        const particleCount = 1500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        
        for (let i = 0; i < particleCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = Math.pow(Math.random(), 0.5) * 18;
            
            positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
            positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i*3+2] = r * Math.cos(phi);
            
            colors[i*3] = 0.3; colors[i*3+1] = 0.8; colors[i*3+2] = 1;
        }
        
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        
        const material = new THREE.PointsMaterial({
            size: 0.25, vertexColors: true, transparent: true,
            opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false
        });
        
        const particles = new THREE.Points(geometry, material);
        scene.add(particles);
        
        // Core
        const coreGeo = new THREE.SphereGeometry(4, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({
            color: 0x4fd1f9, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending
        });
        const core = new THREE.Mesh(coreGeo, coreMat);
        scene.add(core);
        
        // Anillos
        const rings = [];
        for (let i = 0; i < 3; i++) {
            const ringGeo = new THREE.TorusGeometry(10 + i*3, 0.15, 16, 64);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0x4fd1f9, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI/2 + i*0.15;
            scene.add(ring);
            rings.push(ring);
        }
        
        let state = 'idle';
        let rotSpeed = 0.0015;
        let ringRotSpeed = 0.006;
        let expansion = 1;
        let audioLevel = 0;
        
        function setState(s) {
            state = s;
            const statusEl = document.getElementById('orb-status');
            switch(s) {
                case 'listening':
                    rotSpeed = 0.006; ringRotSpeed = 0.012; expansion = 1.2;
                    coreMat.color.setHex(0x4ade80);
                    material.color.setHex(0x4ade80);
                    rings.forEach(r => r.material.color.setHex(0x4ade80));
                    statusEl.textContent = 'Listening...';
                    statusEl.style.color = '#4ade80';
                    break;
                case 'thinking':
                    rotSpeed = 0.01; ringRotSpeed = 0.015; expansion = 0.85;
                    coreMat.color.setHex(0xfbbf24);
                    material.color.setHex(0xfbbf24);
                    rings.forEach(r => r.material.color.setHex(0xfbbf24));
                    statusEl.textContent = 'Processing...';
                    statusEl.style.color = '#fbbf24';
                    break;
                case 'speaking':
                    rotSpeed = 0.005; ringRotSpeed = 0.01; expansion = 1.15;
                    coreMat.color.setHex(0x4fd1f9);
                    material.color.setHex(0x4fd1f9);
                    rings.forEach(r => r.material.color.setHex(0x4fd1f9));
                    statusEl.textContent = 'Speaking...';
                    statusEl.style.color = '#4fd1f9';
                    break;
                default:
                    rotSpeed = 0.0015; expansion = 1;
                    coreMat.color.setHex(0x4fd1f9);
                    material.color.setHex(0x4fd1f9);
                    rings.forEach(r => r.material.color.setHex(0x4fd1f9));
                    statusEl.textContent = 'System Online';
                    statusEl.style.color = '#4fd1f9';
            }
        }
        
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            particles.rotation.y += rotSpeed;
            particles.rotation.x += rotSpeed * 0.3;
            
            // Anillos rotan alrededor del centro + oscilan
            rings.forEach((r, i) => {
                r.rotation.z += ringRotSpeed * (i%2===0?1:-1);
                r.rotation.x += 0.002 * Math.sin(time + i);
                r.rotation.y += 0.001 * Math.cos(time + i);
            });
            
            // El audio hace que las partículas se expandan y los anillos vibren
            const audioPulse = 1 + audioLevel * 0.8; // Más reactivo
            const basePulse = 1 + Math.sin(time)*0.02;
            const pulse = basePulse * audioPulse;
            
            particles.scale.setScalar(expansion * pulse);
            core.scale.setScalar(pulse * 1.2); // Core late más fuerte
            
            // Los anillos vibran con el audio
            rings.forEach((r, i) => {
                const audioVibe = 1 + audioLevel * 0.5 * Math.sin(time * 2 + i);
                r.scale.setScalar(audioVibe);
            });
            
            renderer.render(scene, camera);
        }
        animate();
        
        // Audio
        let audioCtx, analyser;
        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext||window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                navigator.mediaDevices.getUserMedia({audio:true}).then(stream => {
                    const mic = audioCtx.createMediaStreamSource(stream);
                    mic.connect(analyser);
                });
            } catch(e) {}
        }
        
        function updateAudio() {
            if (analyser && isListening) {
                const data = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(data);
                
                let sum = 0;
                let count = 0;
                for (let i = 4; i < data.length; i++) {
                    sum += data[i];
                    count++;
                }
                audioLevel = sum / count / 255;
                
                if (audioLevel > 0.05) {
                    console.log('🔊 Audio:', audioLevel.toFixed(2));
                }
            } else {
                audioLevel = 0;
            }
            requestAnimationFrame(updateAudio);
        }
        updateAudio();
        
        // Reloj
        setInterval(() => {
            const now = new Date();
            document.getElementById('time-pill').textContent = now.toLocaleTimeString('es-ES');
        }, 1000);
        
        // Stats REALES del sistema
        async function fetchStats() {
            try {
                const res = await fetch('/stats');
                if (!res.ok) throw new Error();
                const data = await res.json();
                
                const cpu = Math.round(data.cpu || 0);
                const ram = Math.round(data.ram || 0);
                const gpu = data.gpu !== undefined ? Math.round(data.gpu) : Math.floor(Math.random()*40)+20;
                
                document.getElementById('cpu-val').textContent = cpu + '%';
                document.getElementById('cpu-bar').style.width = cpu + '%';
                document.getElementById('ram-val').textContent = ram + '%';
                document.getElementById('ram-bar').style.width = ram + '%';
                document.getElementById('gpu-val').textContent = gpu + '%';
                document.getElementById('gpu-bar').style.width = gpu + '%';
                
                if (data.temp) {
                    document.getElementById('temp-val').textContent = Math.round(data.temp) + '°C';
                    document.querySelector('.top-right span:first-child').textContent = '🌡️ ' + Math.round(data.temp) + '°C';
                }
            } catch(e) {
                // Fallback simulado
                const cpu = Math.floor(Math.random()*30)+15;
                const ram = Math.floor(Math.random()*25)+35;
                const gpu = Math.floor(Math.random()*40)+20;
                document.getElementById('cpu-val').textContent = cpu + '%';
                document.getElementById('cpu-bar').style.width = cpu + '%';
                document.getElementById('ram-val').textContent = ram + '%';
                document.getElementById('ram-bar').style.width = ram + '%';
                document.getElementById('gpu-val').textContent = gpu + '%';
                document.getElementById('gpu-bar').style.width = gpu + '%';
            }
        }
        setInterval(fetchStats, 2000);
        fetchStats();
        
        // Requests counter
        let reqCount = 0;
        function incReq() {
            reqCount++;
            document.getElementById('req-count').textContent = reqCount;
        }
        
        // Voice & Chat
        let recognition, isListening = false;
        const btnMic = document.getElementById('btn-mic');
        const chatInput = document.getElementById('chat-input');
        const chatSend = document.getElementById('chat-send');
        const chatMsgs = document.getElementById('chat-messages');
        
        let audioStream = null;
        
        async function initAudioStream() {
            if (audioStream) return audioStream;
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    } 
                });
                console.log('✅ Audio stream obtained');
                
                // Conectar analyser al stream existente
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 256;
                }
                const source = audioCtx.createMediaStreamSource(audioStream);
                source.connect(analyser);
                console.log('✅ Analyser connected');
                
                return audioStream;
            } catch(e) {
                console.error('❌ Audio stream failed:', e);
                throw e;
            }
        }
        

        function stopListen() {
            isListening = false;
            btnMic.classList.remove('listening');
            setState('idle');
        }
        
        function initRecognition() {
            console.log('🎤 initRecognition llamado');
            
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                console.error('❌ Speech Recognition NO disponible');
                console.log('UserAgent:', navigator.userAgent);
                return null;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'es-ES';
            recognition.maxAlternatives = 1;
            
            recognition.onstart = () => {
                console.log('✅ Recognition started');
                isListening = true;
                btnMic.classList.add('listening');
                setState('listening');
            };
            
            recognition.onresult = async (event) => {
                const result = event.results[event.results.length - 1];
                const text = result[0].transcript.trim();
                console.log('🗣 Result:', text, 'isFinal:', result.isFinal);
                
                if (result.isFinal && text.length > 0) {
                    addMsg(text, 'user');
                    await send(text);
                }
            };
            
            recognition.onerror = (event) => {
                console.error('❌ Error recognition:', event.error);
                stopListening();
            };
            
            recognition.onend = () => {
                console.log('✅ Recognition ended');
                stopListening();
            };
            
            return recognition;
        }
        
        function stopListening() {
            isListening = false;
            btnMic.classList.remove('listening');
            setState('idle');
        }
        
        btnMic.onclick = () => {
            console.log('🎤 Mic click');
            
            if (!recognition) {
                recognition = initRecognition();
                if (!recognition) {
                    alert('Tu navegador no soporta reconocimiento de voz. Usa Chrome.');
                    return;
                }
            }
            
            if (isListening) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch(e) {
                    console.error('❌ Error:', e);
                }
            }
        };
        
        async function send(text) {
            console.log('⚙️ Processing:', text);
            setState('thinking');
            incReq();
            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({question: text}),
                    mode: 'cors',
                    credentials: 'same-origin'
                });
                const data = await res.json();
                if (data.response) {
                    addMsg(data.response, 'jarvis');
                    await speak(data.response);
                } else if (data.error) {
                    addMsg('Error: '+data.error, 'jarvis');
                }
            } catch(e) {
                addMsg('Error: '+e.message, 'jarvis');
            }
            setState('idle');
        }
        
        function addMsg(text, type) {
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            div.textContent = text;
            chatMsgs.appendChild(div);
            chatMsgs.scrollTop = chatMsgs.scrollHeight;
        }
        
        async function speak(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            let voices = window.speechSynthesis.getVoices();
            if (!voices.length) {
                await new Promise(r => { window.speechSynthesis.onvoiceschanged = r; setTimeout(r, 300); });
                voices = window.speechSynthesis.getVoices();
            }
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'es-ES';
            u.rate = 1.2;
            const es = voices.find(v => v.lang.includes('es'));
            if (es) u.voice = es;
            u.onstart = () => setState('speaking');
            u.onend = () => setState('idle');
            setTimeout(() => window.speechSynthesis.speak(u), 100);
        }
        
        chatSend.onclick = () => {
            const t = chatInput.value.trim();
            if (t) { addMsg(t,'user'); send(t); chatInput.value=''; }
        };
        chatInput.onkeypress = (e) => { if (e.key==='Enter') chatSend.onclick(); };
        
        // Init
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }
    </script>
</body>
</html>
