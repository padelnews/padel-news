<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MI NUEVO PC GAMING - TikTok</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .poster {
            width: 1080px;
            height: 1920px;
            position: relative;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 50%, #0a0a0a 100%);
            overflow: hidden;
        }
        
        /* Efectos de fondo */
        .neon-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }
        
        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }
        
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
        }
        
        .orb-1 {
            width: 400px;
            height: 400px;
            background: #00ffff;
            top: 10%;
            left: 20%;
            animation: pulse 3s ease-in-out infinite;
        }
        
        .orb-2 {
            width: 500px;
            height: 500px;
            background: #ff00ff;
            bottom: 20%;
            right: 10%;
            animation: pulse 4s ease-in-out infinite reverse;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }
        
        /* Título principal */
        .title {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
        }
        
        .title h1 {
            font-size: 72px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #00ffff,
                0 0 80px #00ffff;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #00ffff; }
            to { text-shadow: 0 0 20px #ff00ff, 0 0 30px #ff00ff, 0 0 50px #ff00ff, 0 0 80px #ff00ff; }
        }
        
        .subtitle {
            font-size: 32px;
            color: #ff00ff;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 15px;
            text-shadow: 0 0 10px #ff00ff;
        }
        
        /* Marco de la imagen */
        .image-frame {
            position: absolute;
            top: 250px;
            left: 50px;
            right: 50px;
            bottom: 300px;
            border: 4px solid #00ffff;
            box-shadow: 
                0 0 20px #00ffff,
                inset 0 0 20px #00ffff;
            overflow: hidden;
        }
        
        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Overlay de la imagen */
        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                45deg,
                rgba(0, 255, 255, 0.2) 0%,
                transparent 50%,
                rgba(255, 0, 255, 0.2) 100%
            );
            mix-blend-mode: overlay;
        }
        
        /* Partículas */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px #00ffff;
            animation: float 10s linear infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }
        
        /* Stats flotantes */
        .stats-container {
            position: absolute;
            bottom: 350px;
            left: 50px;
            right: 50px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            z-index: 100;
        }
        
        .stat-box {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        
        .stat-value {
            font-size: 36px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 10px;
        }
        
        .stat-label {
            font-size: 16px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        /* Footer */
        .footer {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
        }
        
        .cta {
            font-size: 42px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #ff00ff;
            margin-bottom: 20px;
        }
        
        .social {
            font-size: 24px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 10px;
        }
        
        /* Líneas decorativas */
        .deco-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            animation: scanline 3s linear infinite;
        }
        
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(2000px); }
        }
    </style>
</head>
<body>
    <div class="poster">
        <!-- Fondo -->
        <div class="neon-grid"></div>
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        
        <!-- Línea escáner -->
        <div class="deco-line" style="top: 0; left: 0; right: 0;"></div>
        
        <!-- Partículas -->
        <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
        <div class="particle" style="left: 30%; animation-delay: 2s;"></div>
        <div class="particle" style="left: 50%; animation-delay: 4s;"></div>
        <div class="particle" style="left: 70%; animation-delay: 6s;"></div>
        <div class="particle" style="left: 90%; animation-delay: 8s;"></div>
        
        <!-- Título -->
        <div class="title">
            <h1>MI NUEVO<br/>PC GAMING</h1>
            <div class="subtitle">2026 BUILD</div>
        </div>
        
        <!-- Imagen -->
        <div class="image-frame">
            <img src="componentes_pc.jpg" alt="Componentes PC">
            <div class="image-overlay"></div>
        </div>
        
        <!-- Stats -->
        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-value">RTX<br/>5060 Ti</div>
                <div class="stat-label">GPU</div>
            </div>
            <div class="stat-box">
                <div class="stat-value">RYZEN<br/>7 5700X</div>
                <div class="stat-label">CPU</div>
            </div>
            <div class="stat-box">
                <div class="stat-value">32GB<br/>DDR4</div>
                <div class="stat-label">RAM</div>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <div class="cta">PRÓXIMAMENTE</div>
            <div class="social">#PCGAMING #TIKTOK</div>
        </div>
    </div>
</body>
</html>
