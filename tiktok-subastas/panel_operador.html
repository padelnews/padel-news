<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Operador - TikTok Subastas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(90deg, #ff0050, #00f2ea);
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 32px;
            text-transform: uppercase;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
        }
        
        .card {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #333;
        }
        
        .card h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #00f2ea;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #888;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #00f2ea;
        }
        
        .timer-display {
            font-size: 72px;
            font-weight: 900;
            text-align: center;
            font-family: 'Courier New', monospace;
            color: #ff4444;
            margin: 20px 0;
            text-shadow: 0 0 30px rgba(255, 68, 68, 0.5);
        }
        
        .btn {
            padding: 14px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            margin: 5px;
            font-size: 16px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #ff0050, #00f2ea);
            color: #fff;
        }
        
        .btn-success {
            background: #00ff88;
            color: #000;
        }
        
        .btn-danger {
            background: #ff4444;
            color: #fff;
        }
        
        .current-bid {
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        
        .current-bid-amount {
            font-size: 48px;
            font-weight: 900;
            color: #00ff88;
        }
        
        .current-bid-user {
            font-size: 20px;
            color: #00f2ea;
            margin-top: 10px;
        }
        
        .winner-form {
            background: rgba(255, 0, 80, 0.1);
            border: 2px solid #ff0050;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .winner-display {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.1), rgba(0, 242, 234, 0.1));
            border: 2px solid #00ff88;
            border-radius: 15px;
            margin: 20px 0;
        }
        
        .winner-display h3 {
            font-size: 24px;
            color: #00ff88;
            margin-bottom: 15px;
        }
        
        .winner-info {
            font-size: 18px;
            margin: 10px 0;
        }
        
        .chat-preview {
            background: #0a0a0a;
            border-radius: 8px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
        }
        
        .chat-message {
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
        }
        
        .chat-message.bid {
            border-left: 3px solid #ff0050;
            background: rgba(255, 0, 80, 0.1);
        }
        
        .chat-message.claim {
            border-left: 3px solid #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 Panel Operador</h1>
        <div style="font-size: 18px;">
            🔴 EN DIRECTO
        </div>
    </div>
    
    <div class="main-grid">
        <!-- Panel Principal -->
        <div class="card">
            <h2>📦 Producto Actual</h2>
            
            <div class="input-group">
                <label>Número de Producto:</label>
                <input type="text" id="product-number" placeholder="Ej: 123">
            </div>
            
            <div class="input-group">
                <label>Nombre del Producto:</label>
                <input type="text" id="product-name" placeholder="Ej: Caja Misteriosa Premium">
            </div>
            
            <div class="timer-display" id="timer">00:30</div>
            
            <div style="text-align: center; margin: 20px 0;">
                <input type="number" id="timer-seconds" value="30" min="5" max="120" 
                       style="width: 80px; padding: 10px; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; color: #fff; text-align: center; font-size: 18px;">
                <span style="margin: 0 10px;">segundos</span>
            </div>
            
            <div style="text-align: center;">
                <button class="btn btn-primary" onclick="startTimer()">▶️ INICIAR PUJA</button>
                <button class="btn btn-danger" onclick="stopTimer()">⏹️ PARAR</button>
                <button class="btn btn-success" onclick="assignWinner()">🏆 ASIGNAR GANADOR</button>
            </div>
            
            <div class="current-bid">
                <div style="font-size: 14px; color: #888; margin-bottom: 10px;">MEJOR PUJA ACTUAL</div>
                <div class="current-bid-amount" id="current-amount">€0</div>
                <div class="current-bid-user" id="current-user">-</div>
            </div>
            
            <div class="winner-form" id="winner-form" style="display: none;">
                <h3 style="color: #00ff88; margin-bottom: 15px;">🏆 GANADOR DETECTADO</h3>
                <div style="margin: 15px 0;">
                    <strong>Usuario:</strong> <span id="winner-user" style="color: #00f2ea;"></span><br>
                    <strong>Puja:</strong> <span id="winner-bid" style="color: #00ff88;"></span><br>
                    <strong>Caja:</strong> <span id="winner-box" style="color: #ff0050;"></span>
                </div>
                <button class="btn btn-success" onclick="confirmWinner()" style="width: 100%;">✅ CONFIRMAR Y GUARDAR</button>
            </div>
            
            <div class="winner-display" id="winner-display" style="display: none;">
                <h3>🎉 GANADOR ASIGNADO</h3>
                <div class="winner-info"><strong>Usuario:</strong> <span id="confirmed-user"></span></div>
                <div class="winner-info"><strong>Producto:</strong> <span id="confirmed-product"></span></div>
                <div class="winner-info"><strong>Precio:</strong> <span id="confirmed-price"></span></div>
            </div>
        </div>
        
        <!-- Panel Lateral -->
        <div>
            <div class="card" style="margin-bottom: 20px;">
                <h2>💬 Últimos Mensajes</h2>
                <div class="chat-preview" id="chat-preview"></div>
            </div>
            
            <div class="card">
                <h2>📊 Usuarios con Caja</h2>
                <div id="users-list" style="max-height: 300px; overflow-y: auto;">
                    <!-- Se llena dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 30;
        let timerInterval = null;
        let isRunning = false;
        let currentBid = { amount: 0, user: null };
        let pendingWinner = null;
        
        // Timer
        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0 && isRunning) {
                stopTimer();
                autoAssignWinner();
            }
        }
        
        function startTimer() {
            if (isRunning) return;
            
            timeLeft = parseInt(document.getElementById('timer-seconds').value) || 30;
            isRunning = true;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimer();
            }, 1000);
            
            // Simular pujas (en producción, esto viene del bot real)
            simulateBids();
        }
        
        function stopTimer() {
            isRunning = false;
            clearInterval(timerInterval);
        }
        
        function simulateBids() {
            const bids = [
                { user: '@carlos92', amount: 15 },
                { user: '@maria_garcia', amount: 20 },
                { user: '@juan_perez', amount: 25 },
                { user: '@lucia_88', amount: 30 }
            ];
            
            let bidIndex = 0;
            const bidInterval = setInterval(() => {
                if (!isRunning || bidIndex >= bids.length) {
                    clearInterval(bidInterval);
                    return;
                }
                
                const bid = bids[bidIndex++];
                updateBid(bid.user, bid.amount);
                
            }, 3000);
        }
        
        function updateBid(user, amount) {
            currentBid = { amount, user };
            document.getElementById('current-amount').textContent = `€${amount}`;
            document.getElementById('current-user').textContent = user;
            
            // Añadir al chat
            addChatMessage(user, `${amount}€`, 'bid');
        }
        
        function addChatMessage(user, text, type) {
            const container = document.getElementById('chat-preview');
            const div = document.createElement('div');
            div.className = `chat-message ${type}`;
            div.innerHTML = `<strong>${user}</strong>: ${text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        function autoAssignWinner() {
            if (currentBid.amount > 0 && currentBid.user) {
                // Verificar si tiene caja pagada (simulado)
                const hasBox = true; // En producción, verificar en base de datos
                
                if (hasBox) {
                    pendingWinner = {
                        user: currentBid.user,
                        bid: currentBid.amount,
                        box: 'Caja Premium'
                    };
                    
                    document.getElementById('winner-user').textContent = pendingWinner.user;
                    document.getElementById('winner-bid').textContent = `€${pendingWinner.bid}`;
                    document.getElementById('winner-box').textContent = pendingWinner.box;
                    document.getElementById('winner-form').style.display = 'block';
                } else {
                    alert('❌ El usuario no tiene caja pagada');
                }
            }
        }
        
        function assignWinner() {
            autoAssignWinner();
        }
        
        function confirmWinner() {
            if (!pendingWinner) return;
            
            const productNumber = document.getElementById('product-number').value;
            const productName = document.getElementById('product-name').value;
            
            // Guardar ganador
            const winnerData = {
                user: pendingWinner.user,
                product: productName || `Producto #${productNumber}`,
                price: pendingWinner.bid,
                box: pendingWinner.box,
                time: new Date().toLocaleString('es-ES')
            };
            
            // Enviar al backend
            fetch('/api/guardar_ganador', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(winnerData)
            }).then(() => {
                // Mostrar confirmado
                document.getElementById('winner-form').style.display = 'none';
                document.getElementById('winner-display').style.display = 'block';
                document.getElementById('confirmed-user').textContent = winnerData.user;
                document.getElementById('confirmed-product').textContent = winnerData.product;
                document.getElementById('confirmed-price').textContent = `€${winnerData.price}`;
                
                // Reset para siguiente producto
                setTimeout(() => {
                    document.getElementById('winner-display').style.display = 'none';
                    currentBid = { amount: 0, user: null };
                    document.getElementById('current-amount').textContent = '€0';
                    document.getElementById('current-user').textContent = '-';
                }, 5000);
            });
        }
        
        // Cargar usuarios con caja
        function loadUsers() {
            const users = [
                { user: '@carlos92', box: 'Caja Premium', active: true },
                { user: '@maria_garcia', box: 'Caja VIP', active: true },
                { user: '@juan_perez', box: 'Caja Básica', active: true },
                { user: '@lucia_88', box: 'Caja Premium', active: false }
            ];
            
            const container = document.getElementById('users-list');
            container.innerHTML = users.map(u => `
                <div style="padding: 10px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong style="color: #00f2ea;">${u.user}</strong><br>
                        <small style="color: #888;">${u.box}</small>
                    </div>
                    <div style="width: 10px; height: 10px; border-radius: 50%; background: ${u.active ? '#00ff88' : '#888'};"></div>
                </div>
            `).join('');
        }
        
        loadUsers();
    </script>
</body>
</html>
