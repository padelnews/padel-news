# Padel News Website - Apache Configuration
# Copy this file to /etc/apache2/other/padel_news.conf
# Then restart Apache: sudo apachectl restart

Listen 8080

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot "/Users/cristian/Sites/padel_news"
    
    <Directory "/Users/cristian/Sites/padel_news">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Enable PHP if available
    <IfModule mod_php.c>
        AddHandler php-script .php
    </IfModule>
    
    # Logging
    ErrorLog "/usr/local/var/log/httpd/padel_news_error.log"
    CustomLog "/usr/local/var/log/httpd/padel_news_access.log" common
    
    # Security headers
    Header set X-Content-Type-Options "nosniff"
    Header set X-Frame-Options "SAMEORIGIN"
</VirtualHost>
