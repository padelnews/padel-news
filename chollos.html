<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏓 Chollos de Palas | NOX, Siux, Babolat - Ofertas Outlet 2026</title>
    <meta name="description" content="Ofertas exclusivas en palas de pádel NOX, Siux y Babolat. Descuentos de hasta 74% en outlet. Envío 24h.">
    <link rel="stylesheet" href="css/style-futuristic.css">
    <style>
        :root {
            --nox-color: #ff6b00;
            --siux-color: #e63946;
            --babolat-color: #2a9d8f;
        }
        
        .chollos-hero {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .chollos-hero h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, var(--nox-color), var(--siux-color), var(--babolat-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
        }
        
        .brand-filters {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .brand-filter {
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            font-size: 0.9rem;
        }
        
        .brand-filter.nox { background: var(--nox-color); color: white; }
        .brand-filter.siux { background: var(--siux-color); color: white; }
        .brand-filter.babolat { background: var(--babolat-color); color: white; }
        
        .brand-filter.active {
            border-color: white;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }
        
        /* Grid de 3 columnas */
        .chollos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }
        
        .chollo-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .chollo-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        
        .chollo-discount {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1rem;
            font-weight: bold;
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
            color: white;
        }
        
        .chollo-discount.nox { background: var(--nox-color); }
        .chollo-discount.siux { background: var(--siux-color); }
        .chollo-discount.babolat { background: var(--babolat-color); }
        
        .chollo-brand-tag {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            width: fit-content;
        }
        
        .chollo-brand-tag.nox { background: var(--nox-color); color: white; }
        .chollo-brand-tag.siux { background: var(--siux-color); color: white; }
        .chollo-brand-tag.babolat { background: var(--babolat-color); color: white; }
        
        .chollo-info {
            flex: 1;
            margin-bottom: 0.75rem;
        }
        
        .chollo-info h3 {
            color: var(--text-primary);
            font-size: 0.95rem;
            line-height: 1.3;
            margin-bottom: 0.5rem;
        }
        
        .chollo-prices {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }
        
        .old-price {
            text-decoration: line-through;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        
        .new-price {
            font-size: 1.4rem;
            font-weight: bold;
            color: #00ff88;
        }
        
        .btn-offer {
            display: block;
            text-align: center;
            padding: 0.6rem;
            background: linear-gradient(135deg, #00cc99, #00ff88);
            color: #1a1a2e;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            transition: transform 0.2s;
        }
        
        .btn-offer:hover {
            transform: scale(1.02);
        }
        
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
            padding: 0.75rem;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #00ff88;
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        .last-update {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }
        
        @media (max-width: 1024px) {
            .chollos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 640px) {
            .chollos-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-row {
                flex-wrap: wrap;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="actualidad.html">Actualidad</a></li>
                <li><a href="resultados.html">Resultados</a></li>
                <li><a href="torneos.html">Torneos</a></li>
                <li><a href="chollos.html" class="active">🏷️ Chollos</a></li>
            </ul>
        </div>
    </nav>
    
    <main class="container">
        <div class="chollos-hero">
            <h1>🏓 Chollos de Palas de Pádel</h1>
            <p style="color: var(--text-secondary); font-size: 0.95rem;">
                Ofertas exclusivas en palas <strong>NOX</strong>, <strong>Siux</strong> y <strong>Babolat</strong>
            </p>
        </div>
        
        <div class="brand-filters">
            <span class="brand-filter nox active" data-brand="all">Todas</span>
            <span class="brand-filter nox" data-brand="NOX">NOX</span>
            <span class="brand-filter siux" data-brand="Siux">Siux</span>
            <span class="brand-filter babolat" data-brand="Babolat">Babolat</span>
        </div>
        
        <div class="stats-row">
            <div class="stat">
                <div class="stat-value" id="total-count">0</div>
                <div class="stat-label">Ofertas</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="avg-discount">0%</div>
                <div class="stat-label">Desc. medio</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="max-discount">0%</div>
                <div class="stat-label">Max desc.</div>
            </div>
        </div>
        
        <p class="last-update" id="last-update">Última actualización: --</p>
        
        <div class="chollos-grid" id="chollos-list">
            <p style="text-align:center;color:var(--text-muted);grid-column:1/-1;">Cargando ofertas...</p>
        </div>
    </main>
    
    <script>
        let allChollos = [];
        
        fetch('data/chollos.json')
            .then(r => r.json())
            .then(data => {
                allChollos = data.chollos;
                document.getElementById('last-update').textContent = 
                    `Última actualización: ${data.ultima_actualizacion || data.fecha}`;
                renderChollos('all');
                updateStats();
            })
            .catch(err => {
                document.getElementById('chollos-list').innerHTML = 
                    '<p style="text-align:center;color:var(--text-muted);grid-column:1/-1;">Error cargando chollos</p>';
            });
        
        function getBrandClass(tienda) {
            const t = tienda.toLowerCase();
            if (t.includes('nox')) return 'nox';
            if (t.includes('siux')) return 'siux';
            if (t.includes('babolat')) return 'babolat';
            return 'nox';
        }
        
        function renderChollos(brand) {
            const container = document.getElementById('chollos-list');
            const filtered = brand === 'all' 
                ? allChollos 
                : allChollos.filter(c => c.tienda.toLowerCase().includes(brand.toLowerCase()));
            
            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:var(--text-muted);grid-column:1/-1;">No hay ofertas de esta marca</p>';
                return;
            }
            
            container.innerHTML = filtered.map(chollo => {
                const brandClass = getBrandClass(chollo.tienda);
                return `
                    <div class="chollo-card">
                        <div class="chollo-discount ${brandClass}">-${chollo.descuento}</div>
                        <span class="chollo-brand-tag ${brandClass}">${chollo.tienda}</span>
                        <div class="chollo-info">
                            <h3>${chollo.producto}</h3>
                        </div>
                        <div class="chollo-prices">
                            <span class="old-price">${chollo.precio_original.toFixed(2)}€</span>
                            <span class="new-price">${chollo.precio_oferta.toFixed(2)}€</span>
                        </div>
                        <a href="${chollo.enlace}" target="_blank" class="btn-offer">Ver Oferta →</a>
                    </div>
                `;
            }).join('');
        }
        
        function updateStats() {
            const total = allChollos.length;
            const avgDiscount = Math.round(
                allChollos.reduce((sum, c) => sum + parseInt(c.descuento), 0) / total
            );
            const maxDiscount = Math.max(...allChollos.map(c => parseInt(c.descuento)));
            
            document.getElementById('total-count').textContent = total;
            document.getElementById('avg-discount').textContent = avgDiscount + '%';
            document.getElementById('max-discount').textContent = maxDiscount + '%';
        }
        
        document.querySelectorAll('.brand-filter').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.brand-filter').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderChollos(btn.dataset.brand);
            });
        });
    </script>
</body>
</html>
